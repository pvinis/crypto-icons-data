# this should be a github action that runs every 1 hour, tries to run the project, and then creates a new pull request with the changes.

name: Fetch more

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  fetch-more:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
      - run: |
          bun install
      - name: Fetch
        env:
          COINGECKO_DEMO_API_KEY: ${{ secrets.COINGECKO_DEMO_API_KEY }}
          COINGECKO_PRO_API_KEY: ${{ secrets.COINGECKO_PRO_API_KEY }}
        run: |
          bun run do-it
      - name: Build assets (thumbnails, colours, manifest)
        run: |
          bun run build-assets
      - name: push to main
        # took this from https://github.com/mikeal/publish-to-github-action/blob/master/entrypoint.sh
        run: |
          remote_repo="https://${GITHUB_ACTOR}:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config http.sslVerify false
          git config user.name "pavlobot"
          git config user.email "pavlobot@pvin.is"
          git remote add publisher "${remote_repo}"
          git show-ref # useful for debugging
          git branch --verbose

          git checkout main
          echo "COMMIT_BEFORE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git add -A
          git commit -m "add: more icons" || exit 0
          git pull --rebase publisher main
          git push publisher main
      - name: Tag and trigger site rebuild
        env:
          NETLIFY_BUILD_HOOK_URL: ${{ secrets.NETLIFY_BUILD_HOOK_URL }}
        run: |
          if [ "$(git rev-parse HEAD)" = "$COMMIT_BEFORE" ]; then
            echo "no new commit this run, skipping tag and build hook"
            exit 0
          fi
          if ! git diff --name-only "$COMMIT_BEFORE" HEAD -- data/ | grep -q .; then
            echo "new commit did not change data/, skipping tag and build hook"
            exit 0
          fi
          TAG="data-$(date -u +%Y-%m-%d)"
          if git ls-remote --exit-code publisher "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "tag $TAG already exists on remote, skipping tag creation"
          else
            git tag "$TAG"
            git push publisher "$TAG"
            echo "cut tag $TAG"
          fi
          if [ -n "$NETLIFY_BUILD_HOOK_URL" ]; then
            curl -fsS -X POST "$NETLIFY_BUILD_HOOK_URL" || echo "build hook POST failed (non-fatal)"
          else
            echo "NETLIFY_BUILD_HOOK_URL not set, skipping build hook"
          fi
